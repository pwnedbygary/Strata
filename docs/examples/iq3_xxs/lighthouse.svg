<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Lighthouse in a Storm</title>
  <desc id="desc">A lighthouse standing on a rocky outcrop during a storm, with dark clouds, crashing waves, and a warm beam of light sweeping across the sea.</desc>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#D7E3FC" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D7E3FC" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8C46C" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F8C46C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D7E3FC"/>
      <stop offset="1" stop-color="#D7E3FC" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <g id="sky">
    <rect x="0" y="0" width="512" height="512" fill="url(#skyGrad)"/>
    <path d="M 40 120 Q 80 90 120 120 Q 160 90 200 120 Q 240 90 280 120 Q 320 90 360 120 Q 400 90 440 120 Q 480 90 512 120 L 512 180 Q 480 150 440 180 Q 400 150 360 180 Q 320 150 280 180 Q 240 150 200 180 Q 160 150 120 180 Q 80 150 40 180 Z" fill="#0B1220" opacity="0.6"/>
    <path d="M 0 160 Q 40 130 80 160 Q 120 130 160 160 Q 200 130 240 160 Q 280 130 320 160 Q 360 130 400 160 Q 440 130 480 160 Q 512 130 512 160 L 512 220 Q 480 190 440 220 Q 400 190 360 220 Q 320 190 280 220 Q 240 190 200 220 Q 160 190 120 220 Q 80 190 40 220 Q 0 190 0 220 Z" fill="#0B1220" opacity="0.4"/>
  </g>

  <g id="sea">
    <path d="M 0 320 Q 64 300 128 320 Q 192 340 256 320 Q 320 300 384 320 Q 448 340 512 320 L 512 512 L 0 512 Z" fill="url(#seaGrad)"/>
    <path d="M 0 340 Q 64 320 128 340 Q 192 360 256 340 Q 320 320 384 340 Q 448 360 512 340 L 512 360 Q 448 380 384 360 Q 320 340 256 360 Q 192 380 128 360 Q 64 340 0 360 Z" fill="#D7E3FC" opacity="0.25"/>
    <path d="M 0 380 Q 64 360 128 380 Q 192 400 256 380 Q 320 360 384 380 Q 448 400 512 380 L 512 400 Q 448 420 384 400 Q 320 380 256 400 Q 192 420 128 400 Q 64 380 0 400 Z" fill="#D7E3FC" opacity="0.15"/>
    <path d="M 0 420 Q 64 400 128 420 Q 192 440 256 420 Q 320 400 384 420 Q 448 440 512 420 L 512 440 Q 448 460 384 440 Q 320 420 256 440 Q 192 460 128 440 Q 64 420 0 440 Z" fill="#D7E3FC" opacity="0.1"/>
  </g>

  <g id="lighthouse">
    <path d="M 220 420 L 292 420 L 280 460 L 232 460 Z" fill="#0B1220"/>
    <path d="M 232 460 L 280 460 L 270 490 L 242 490 Z" fill="#0B1220" opacity="0.8"/>
    <path d="M 235 220 L 277 220 L 270 420 L 242 420 Z" fill="url(#towerGrad)"/>
    <path d="M 235 220 L 277 220 L 277 240 L 235 240 Z" fill="#0B1220" opacity="0.3"/>
    <path d="M 238 260 L 274 260 L 274 280 L 238 280 Z" fill="#0B1220" opacity="0.3"/>
    <path d="M 241 300 L 271 300 L 271 320 L 241 320 Z" fill="#0B1220" opacity="0.3"/>
    <path d="M 244 340 L 268 340 L 268 360 L 244 360 Z" fill="#0B1220" opacity="0.3"/>
    <path d="M 247 380 L 265 380 L 265 400 L 247 400 Z" fill="#0B1220" opacity="0.3"/>
    <path d="M 230 200 L 282 200 L 282 220 L 230 220 Z" fill="#0B1220"/>
    <path d="M 238 180 L 274 180 L 274 200 L 238 200 Z" fill="#F8C46C"/>
    <path d="M 238 180 L 274 180 L 256 160 Z" fill="#0B1220"/>
    <path d="M 256 160 L 256 140 L 260 140 L 260 160 Z" fill="#0B1220"/>
  </g>

  <g id="beam">
    <path d="M 256 190 L 480 120 L 480 260 Z" fill="url(#beamGrad)"/>
    <path d="M 256 190 L 480 140 L 480 240 Z" fill="#F8C46C" opacity="0.3"/>
    <path d="M 256 190 L 480 160 L 480 220 Z" fill="#F8C46C" opacity="0.5"/>
    <circle cx="256" cy="190" r="12" fill="#F8C46C"/>
    <circle cx="256" cy="190" r="8" fill="#F8C46C" opacity="0.8"/>
  </g>
</svg>
