<title>NEON SERPENT — Arcade Snake</title>
<style>
  :root{
    --bg:#05070d; --panel:#0b1018; --panel2:#0e141d;
    --line:#1b2733; --line2:#243444;
    --ink:#e9f1f7; --dim:#8fa3b3; --dim2:#5f7280;
    --green:#39e07a; --green2:#1f9e55;
    --red:#ff4d5e; --amber:#ffb43a; --cyan:#37d6e6;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Courier New", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 50% -12%, #101a26 0%, #070b12 55%, #04060a 100%),
      var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:16px;
  }
  .stage{
    display:flex; flex-direction:column; align-items:center;
    width:min(94vw, 640px);
    gap:14px;
  }
  .title{
    font-family:var(--mono); font-weight:800; letter-spacing:.14em;
    font-size:clamp(22px, 4.4vw, 34px);
    color:var(--green);
    text-shadow:0 0 18px rgba(57,224,122,.55), 0 0 4px rgba(57,224,122,.9);
    text-transform:uppercase;
  }
  .subtitle{
    font-family:var(--mono); font-size:11px; letter-spacing:.34em;
    color:var(--dim2); text-transform:uppercase; margin-top:2px;
  }
  .panel{
    background:linear-gradient(180deg, var(--panel2), var(--panel));
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    box-shadow:0 10px 26px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .hud{
    display:flex; flex-wrap:wrap; gap:10px 14px; justify-content:center;
    font-family:var(--mono); font-size:12px; letter-spacing:.06em;
  }
  .hud .chip{
    display:inline-flex; align-items:center; gap:8px;
    padding:6px 10px; border-radius:8px;
    background:rgba(255,255,255,.03); border:1px solid var(--line);
  }
  .hud .chip b{ color:var(--dim); }
  .hud .chip span{ color:var(--ink); }
  .hud .chip span.score{ color:var(--green); text-shadow:0 0 8px rgba(57,224,122,.5); }
  .hud .chip span.time{ color:var(--cyan); }
  .hud .chip span.best{ color:var(--amber); }
  .hud .chip span.state{ color:var(--amber); }
  .hud .chip span.state.dead{ color:var(--red); }
  .hud .chip span.state.play{ color:var(--green); }
  .hud .chip span.state.pause{ color:var(--dim); }

  .board-wrap{
    position:relative;
    width:min(90vw, 560px);
    aspect-ratio:1 1;
    border-radius:12px;
    background:var(--panel);
    border:1px solid var(--line2);
    box-shadow:0 14px 30px rgba(0,0,0,.6), inset 0 0 0 rgba(0,0,0,.4);
  }
  canvas{
    position:absolute; inset:0; width:100%; height:100%;
    border-radius:12px; display:block;
  }
  .overlay{
    position:absolute; inset:0; border-radius:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:18px;
    pointer-events:none;
  }
  .overlay .big{
    font-family:var(--mono); font-weight:800; letter-spacing:.12em;
    font-size:clamp(20px, 5vw, 34px); text-transform:uppercase;
  }
  .overlay .big.dead{ color:var(--red); text-shadow:0 0 16px rgba(255,77,94,.6); }
  .overlay .big.pause{ color:var(--amber); text-shadow:0 0 14px rgba(255,180,58,.5); }
  .overlay .big.ready{ color:var(--green); text-shadow:0 0 14px rgba(57,224,122,.5); }
  .overlay .sub{ font-family:var(--mono); font-size:12px; color:var(--dim); letter-spacing:.08em; margin-top:8px; }
