<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Lighthouse in a Storm</title>
  <desc id="dsc">A lighthouse on a rocky outcrop casts a warm beam of light across a stormy sea beneath dark clouds.</desc>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#D7E3FC"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D7E3FC"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8C46C" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F8C46C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D7E3FC"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <g id="sky">
