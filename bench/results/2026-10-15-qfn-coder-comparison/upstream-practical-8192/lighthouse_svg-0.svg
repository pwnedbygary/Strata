    <path d="M 0 300 Q 64 288 128 300 Q 192 312 256 300 Q 320 288 384 300 Q 448 312 512 300 L 512 330 L 0 330 Z" fill="#D7E3FC" opacity="0.5"/>
    <path d="M 0 340 Q 64 328 128 340 Q 192 352 256 340 Q 320 328 384 340 Q 448 352 512 340 L 512 370 L 0 370 Z" fill="#D7E3FC" opacity="0.35"/>
    <path d="M 0 380 Q 64 368 128 380 Q 192 392 256 380 Q 320 368 384 380 Q 448 392 512 380 L 512 410 L 0 410 Z" fill="#D7E3FC" opacity="0.25"/>
    <path d="M 0 420 Q 64 408 128 420 Q 192 432 256 420 Q 320 408 384 420 Q 448 432 512 420 L 512 450 L 0 450 Z" fill="#D7E3FC" opacity="0.18"/>
    <path d="M 0 460 Q 64 448 128 460 Q 192 472 256 460 Q 320 448 384 460 Q 448 472 512 460 L 512 490 L 0 490 Z" fill="#D7E3FC" opacity="0.12"/>
