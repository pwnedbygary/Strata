    <path d="M 220 285 L 292 285 L 280 150 L 232 150 Z" fill="url(#towerGrad)"/>
    <path d="M 232 150 L 280 150 L 276 132 L 236 132 Z" fill="#0B1220"/>
    <path d="M 236 132 L 276 132 L 276 112 L 236 112 Z" fill="#0B1220"/>
    <path d="M 236 112 L 276 112 L 256 92 Z" fill="#0B1220"/>
    <circle cx="256" cy="122" r="9" fill="#F8C46C"/>
  </g>
  <g id="beam">
