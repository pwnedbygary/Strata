<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON SERPENT — Arcade Snake</title>
<style>
  :root{
    --bg:#05070d; --panel:#0b1018; --panel2:#0e141d;
    --line:rgba(120,180,255,.10); --line2:rgba(120,180,255,.05);
    --ink:#eaf2ff; --dim:#8fa3c0; --dim2:#5f7188;
    --cyan:#35e6ff; --cyan-d:#0e9fbf;
    --magenta:#ff3d8b; --magenta-d:#b0205a;
    --lime:#b6ff5a; --amber:#ffcf5a; --red:#ff4d5e;
    --mono:'Courier New',ui-monospace,monospace;
    --disp:'Impact','Haettenschweiler','Arial Narrow Bold',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:
      radial-gradient(120% 90% at 50% -10%, #0c1626 0%, #05070d 55%, #03040a 100%),
      #05070d;
    color:var(--ink);
    font-family:var(--mono);
    -webkit-tap-highlight-color:transparent;
    touch-action:man manipulation;
  }
  .scan{position:fixed;inset:0;pointer-events:none;z-index:9999;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.16) 2px 3px);
    mix-blend-mode:multiply;opacity:.55}
  .vign{position:fixed;inset:0;pointer-events:none;z-index:9998;
    background:radial-gradient(120% 120% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}

  .wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .stage{position:relative;width:min(94vw,94vh);height:min(94vw,94vh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}

  .title{font-family:var(--disp);font-style:italic;letter-spacing:1px;line-height:.9;
    font-size:clamp(26px,7.2vmin,64px);color:var(--ink);
    text-shadow:0 0 14px rgba(53,230,255,.55),0 0 3px rgba(53,230,255,.9),2px 2px 0 var(--magenta-d);
    transform:skewX(-6deg);animation:flick 5.5s steps(1) infinite}
  @keyframes flick{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.72}94%{opacity:1}97%{opacity:.85}98%{opacity:1}}
  .sub{font-size:clamp(9px,1.7vmin,15px);letter-spacing:3px;color:var(--dim);text-transform:uppercase}

  .panel{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:10px;
    box-shadow:0 0 22px rgba(53,230,255,.10),inset 0 0 1px rgba(120,180,255,.15)}
  .panel::before{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;
    background:linear-gradient(180deg,rgba(120,180,255,.06),transparent 40%)}

  .hud{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;
    border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,var(--panel2),var(--panel));
    box-shadow:0 0 18px rgba(53,230,255,.08)}
  .hud .lbl{font-size:clamp(8px,1.5vmin,13px);letter-spacing:2px;color:var(--dim);text-transform:uppercase}
  .hud .val{font-family:var(--disp);font-size:clamp(16px,3.4vmin,30px);color:var(--cyan);
    text-shadow:0 0 10px rgba(53,230,255,.6);min-width:2.4em;text-align:right}
  .hud .val.score{color:var(--lime);text-shadow:0 0 10px rgba(182,255,90,.6)}
  .hud .val.hi{color:var(--amber);text-shadow:0 0 10px rgba(255,207,90,.6)}
  .hud .val.st{color:var(--magenta);text-shadow:0 0 10px rgba(255,61,139,.6);font-size:clamp(11px,2.4vmin,20px)}
  .hud .val.st.paused{color:var(--amber)}
  .hud .val.st.dead{color:var(--red)}
  .hud .val.st.run{color:var(--lime)}
  .hud .val.st.run::after{content:""}
  .hud .val.st.run{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{font-family:var(--mono);font-weight:700;font-size:clamp(10px,1.9vmin,15px);letter-spacing:1px;
    text-transform:uppercase;color:var(--ink);cursor:pointer;user-select:none;
    padding:9px 16px;border:1px solid var(--line);border-radius:8px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    box-shadow:0 0 14px rgba(53,230,255,.10),inset 0 0 1px rgba(120,180,255,.2);
    transition:transform .08s ease,box-shadow .12s ease,filter .12s ease}
  .btn:hover{transform:translateY(-1px);box-shadow:0 0 20px rgba(53,230,255,.22);filter:brightness(1.12)}
  .btn:active{transform:translateY(1px);filter:brightness(.9)}
  .btn.start{border-color:rgba(53,230,255,.4);box-shadow:0 0 16px rgba(53,230,255,.18)}
  .btn.restart{border-color:rgba(255,61,139,.4);box-shadow:0 0 16px rgba(255,61,139,.18)}
  .btn.restart::before{content:"↻ "}
  .btn.start::before{content:"▶ "}

  .stageWrap{position:relative;width:min(80vw,80vh);height:min(80vw,80vh)}
  .board{position:absolute;inset:0;border-radius:12px;overflow:hidden;
    box-shadow:0 0 30px rgba(53,230,255,.14),inset 0 0 2px rgba(120,180,255,.25)}
  .board::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:12px;
    background:linear-gradient(180deg,rgba(120,180,255,.05),transparent 30%,transparent 70%,rgba(0,0,0,.25))}
  canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;display:block}

  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;text-align:center;pointer-events:none;opacity:0;transition:opacity .18s ease}
  .overlay.show{opacity:1}
  .overlay .big{font-family:var(--disp);font-style:italic;font-size:clamp(22px,6vmin,52px);color:var(--red);
    text-shadow:0 0 16px rgba(255,77,94,.7),2px 2px 0 var(--magenta-d);letter-spacing:1px}
  .overlay .big.paused{color:var(--amber);text-shadow:0 0 16px rgba(255,207,90,.7)}
  .overlay .big.paused{animation:blink 1.4s steps(1) infinite}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.35}}
  .overlay .hint{font-size:clamp(9px,1.7vmin,14px);color:var(--dim);letter-spacing:1px}
  .overlay .hint b{color:var(--cyan)}

  .dpad .pad{position:absolute;width:22vmin;height:22vmin;pointer-events:none}

  .dpad .pad::after{content:"";position:absolute;inset:0;pointer-events:auto;cursor:pointer;
