    <path d="M 0 430 Q 70 415 140 430 Q 210 415 280 430 Q 350 415 420 430 Q 490 415 512 430 L 512 442 Q 480 435 440 442 Q 400 435 360 442 Q 320 435 280 442 Q 240 435 200 442 Q 160 435 120 442 Q 80 435 40 442 Q 0 438 0 442 Z" fill="#D7E3FC" opacity="0.18"/>
    <path d="M 0 475 Q 80 460 160 475 Q 240 460 320 475 Q 400 460 480 475 Q 512 470 512 475 L 512 487 Q 480 480 440 487 Q 400 480 360 487 Q 320 480 280 487 Q 240 480 200 487 Q 160 480 120 487 Q 80 480 40 487 Q 0 483 0 487 Z" fill="#D7E3FC" opacity="0.12"/>
