<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON SERPENT — Arcade Snake</title>
<style>
  :root{
    --bg:#05070d; --panel:#0b1018; --panel2:#0e141d;
    --line:#1b2733; --line2:#243444;
    --ink:#e9f1f7; --dim:#8fa3b3; --dim2:#5f7183;
    --green:#39e07a; --green2:#1f9e55;
    --red:#ff4d5e; --amber:#ffb454; --cyan:#43d9ff;
    --mono:'Courier New',ui-monospace,monospace;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;min-height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--sans);color:var(--ink);-webkit-tap-highlight-color:transparent}
  .stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px}
  .bgfx{position:absolute;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1200px 700px at 50% -12%, rgba(67,217,255,.06), transparent 60%),
      radial-gradient(900px 600px at 50% 118%, rgba(57,224,122,.05), transparent 60%),
      radial-gradient(700px 500px at 12% 40%, rgba(255,77,94,.04), transparent 60%),
      radial-gradient(700px 500px at 88% 60%, rgba(255,180,84,.04), transparent 60%),
      var(--bg);}
  .scan{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.16) 2px 3px);}
  .vign{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 120% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%);}
  .fx{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.16) 2px 3px),
      radial-gradient(120% 120% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%);}
  .fx::after{content:"";position:absolute;left:0;right:0;height:120px;
    background:linear-gradient(rgba(255,255,255,.03),transparent);animation:scanmove 7s linear infinite;}
  @keyframes scanmove{0%{top:-140px}100%{top:100%}}

  .hud{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;padding:10px 12px}
  .hud-top{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 12px}
  .hud-bot{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 12px}
  .brand{font-family:var(--mono);font-weight:700;letter-spacing:3px;font-size:clamp(15px,2.4vw,22px);color:var(--ink);text-shadow:0 0 10px rgba(67,217,255,.5),0 0 2px rgba(67,217,255,.8)}
  .brand span{color:var(--cyan)}
  .brand .sub{display:block;font-size:11px;letter-spacing:2px;color:var(--dim);margin-top:4px}
  .score{font-family:var(--mono);font-weight:700;font-size:clamp(18px,2.6vw,26px);color:var(--green);text-shadow:0 0 12px rgba(57,224,122,.6)}
  .score span{color:var(--dim);font-size:12px;letter-spacing:2px}
  .timer{font-family:var(--mono);font-weight:700;font-size:clamp(16px,2.2vw,22px);color:var(--amber);text-shadow:0 0 10px rgba(255,180,84,.5)}
  .timer span{color:var(--dim);font-size:11px;letter-spacing:2px}
  .timer.paused{color:var(--dim2);text-shadow:none}
  .timer.paused span{color:var(--dim2)}
  .timer.paused::after{content:" · PAUSED";color:var(--dim2)}
  .timer.dead{color:var(--red);text-shadow:0 0 10px rgba(255,77,94,.6)}
  .timer.dead span{color:var(--dim2)}
  .timer.dead::after{content:" · GAME OVER";color:var(--red)}
  .timer.paused.dead::after{content:" · GAME OVER";color:var(--red)}
  .timer.paused.dead{color:var(--red);text-shadow:0 0 10px rgba(255,77,94,.6)}
