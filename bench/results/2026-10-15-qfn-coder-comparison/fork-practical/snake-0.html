    --acc:#39e0c8; --acc2:#37d0ff; --warn:#ff5470; --gold:#ffd35c;

      radial-gradient(900px 600px at 50% 118%, #0c141d 0%, transparent 60%),

    overflow:hidden;
  }
  .bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;

  .panel{background:linear-gradient(180deg,var(--panel),var(--panel2));
