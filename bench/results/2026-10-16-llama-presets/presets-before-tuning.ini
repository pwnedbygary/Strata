version = 1

; RX 9070 XT 16 GiB / Ryzen 7800X3D / 32 GiB RAM / Vulkan
; Baselines derived from local tests, not universal optimal settings.
; Explicit context sizes include input, reasoning, and final output.
[*]
fit = on
fit-target = 1 
load-mode = none
flash-attn = on
jinja = true
parallel = 1
threads = 8
threads-batch = 8
batch-size = 2048
ubatch-size = 2048
cache-type-k = q8_0
cache-type-v = q8_0
cache-prompt = true
cache-ram = 2048
no-mmproj-offload = true

reasoning = on
reasoning-budget = 16384
reasoning-budget-message = Proceed to the answer. Use your analysis so far to provide the complete requested solution.
reasoning-preserve = true
n-predict = 65536

temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

; Speculation did not improve measured Cyber-Tiel decode speed.
; Duplicate Swift MTP entries omitted until they show a measured benefit.
spec-type = draft-mtp,ngram-mod 
spec-draft-n-max = 2
spec-draft-n-min = 0
spec-ngram-mod-n-match = 24
spec-ngram-mod-n-min = 48
spec-ngram-mod-n-max = 64

[TIEL-CODER-35B-A3B-Q4_K_XL]
